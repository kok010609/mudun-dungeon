name: 안드로이드 앱 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 서명 키 준비 (KEYSTORE_BASE64 비밀값이 있을 때만)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/release.jks; echo "정식 서명 키 사용"; else echo "테스트용 키로 서명"; fi
      - name: 빌드 (APK + 플레이스토어용 AAB)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mudun-app
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: 폰에서 받기 쉬운 링크로 올리기 (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mudun.apk
          cp android/app/build/outputs/bundle/release/app-release.aab mudun.aab
          gh release view app >/dev/null 2>&1 || gh release create app --title "무한대로 던전 키우기 앱" --notes "휴대폰에서 mudun.apk 를 눌러 받아 설치하세요."
          gh release edit app --notes "최신 버전 1.0.${{ github.run_number }} · 휴대폰에서 mudun.apk 를 눌러 받아 설치하세요."
          gh release upload app mudun.apk mudun.aab --clobber

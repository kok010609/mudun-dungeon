plugins { id 'com.android.application' }

def ks = file('release.jks')
def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.mudun.dungeon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mudun.dungeon'
        minSdk 24
        targetSdk 35
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'mudun'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // 서명 키가 없으면 테스트용(디버그) 키로 서명 → 폰에 바로 설치는 되지만 플레이스토어엔 못 올림
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }

plugins { id 'com.android.application' }

def ks = file('release.jks')
def vc = (System.getenv('VERSION_CODE') ?: '1') as Integer

android {
    namespace 'com.mudun.dungeon'
    compileSdk 36
    defaultConfig {
        applicationId 'com.mudun.dungeon'
        minSdk 24
        targetSdk 36
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        // 폰 시험용 고정 키 (공개돼도 되는 테스트 키). 플레이스토어용은 아래 release(비밀값) 키를 써요.
        test {
            storeFile file('test.keystore')
            storePassword 'mudun-test'
            keyAlias 'test'
            keyPassword 'mudun-test'
        }
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'mudun'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // 서명 키 비밀값이 없으면 테스트 키로 서명 → 폰에 바로 설치(업데이트해도 저장 유지), 플레이스토어엔 못 올림
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.test
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
